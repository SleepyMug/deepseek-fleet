# The overlay `fleet-setup signin` boots dsh with: a minimal profile of its
# own (dsh-base, with this package installed) turned into the one-shot
# sign-in app. It is not a bundle, so installing fleet-setup in a
# long-running profile does not mount the app there.
- insert:
    - id: fleet-signin
      name: fleet-setup/signin

- id: hmr
  disabled: true
