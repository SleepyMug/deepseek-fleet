version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Services are named for what they are: Boxes, Box, Services, Provision.
    - SERVICE_SUFFIX
    # Messages are named for what they carry, and a Box is answered whole.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
