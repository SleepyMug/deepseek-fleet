# The sign-in app, layered after dsh-base in a profile of its own: add it
# once with `dsh plugin --profile pi-signin add <this folder>`, then sign
# in with `dsh pi-signin [provider]`. The app runs one attempt and exits
# dsh, so a long-running profile must not select this bundle.
- insert:
    - id: pi-signin
      name: '@sleepymug/dsh-pi-signin/app'

- id: hmr
  disabled: true
