# fleet-basic's bundle patch: list it after @sleepymug/fleet-core in a
# profile's bundles (docs/fleet-basic/index.md). Every session the web UI
# makes gets one basic agent preset, a coding agent as pi has it, with
# none of dsh's multi-agent tools, so work that would go to subagents goes
# to taus, with fleet-core's tau_run. The profile's own patch, which dsh's
# settings write, comes after it, and wins.

# dsh's own presets off: standard, ptc, minimal and cordis. fleet-core's
# `tau` preset, for its runs' sessions, stays.
- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

# New sessions get `basic`.
- id: agent-preset-registry
  config:
    default: basic

# read, write, edit (and read_image), glob and grep, bash in the foreground,
# web_search and web_fetch, and skill, which loads tau's primers, the skills
# tau and tau-dev; tau_run comes from fleet-core, for every session. No
# subagents, teams, todo, ask_user, plan mode, goals or background jobs.
- insert:
    - id: preset-basic
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: basic
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: Your working directory is {{cwd}}.

          # AGENTS.md of the project, as pi reads it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # bash, foreground only, with no job tools to manage background ones.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: false
              promoteOnTimeout: false

          # read / write / edit, and read_image
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # glob, and grep, which the same plugin registers
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # web_search and web_fetch
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # skill: the catalog of dsh's skills, tau's primers among them,
          # which tau_run's prompt tells the model to load.
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # Not model tools: automatic compaction, /compact, and old tool-result pruning.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
