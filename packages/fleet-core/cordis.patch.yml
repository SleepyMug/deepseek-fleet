# fleet-core's bundle patch: list fleet-core after @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-web-app in the fleet profile's bundles. It adds fleet-tau,
# the tau service (docs/fleet-core/tau/index.md), which makes each tau's
# session through dsh's session controller, and the agent preset those
# sessions have, and changes nothing else.

- insert:
    # The socket `fleet` talks to, $DSH_HOME/fleet/tau.sock, and the
    # registry of sessions and their boxes, $DSH_HOME/fleet/taus/.
    - id: fleet-tau
      name: fleet-core/tau/plugin
      config:
        dshHome: !!js dshHomePath()

# ── The agent preset of a tau's session ──
#
# fleet-tau makes a tau's session with the `tau` preset (src/tau/plugin.ts).
# Tools would run on the host, where the paths the tau's prompt names are
# not, until fleet-core runs them in the session's box, so for now it has
# none: the model answers in text.
- insert:
    - id: preset-tau
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: tau
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an agent powered by the {{model}} model, running a tau; its prompt is your task.

          # Not model tools: automatic compaction, /compact, and old tool-result pruning.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
