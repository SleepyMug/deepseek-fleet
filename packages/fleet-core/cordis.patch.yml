# The fleet profile's layer over @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-web-app: list it after them in the profile's bundles. It
# sets the profile up, with no sandbox, nothing that waits on a person and
# one agent preset, and adds the fleet host's core: fleet-box, the Docker
# execution world; fleet-tau, the tau runtime on it; and fleet-control, the
# socket through which fleet-client's `fleet` command runs sessions. Which
# model runs, and how large its context is, is the profile's own setting,
# in its cordis.patch.yml.
# A patch's `name` only asserts an existing row's module, so swapping a
# module means disabling its row and inserting a replacement under a new id.
#
# ═══ The profile: no sandbox, nothing waits on a person, one agent preset ═══

# ── No sandbox: unconfined bash and file tools, no Permissions selector ──

# The confining `ctx.shell` executor; it requires `ctx.sandbox`.
- id: bash-sandbox
  disabled: true

- id: sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

# Permission presets mount only over a confining bash executor.
- id: permission
  disabled: true

- id: ui-permission
  disabled: true

# Requires `ctx.sandbox`; no preset below uses PTC.
- id: ptc-runtime
  disabled: true

# The resolved mode is part of the model's runtime context every turn.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

# The unconfined `ctx.shell` executor, which runs bash through
# `ctx.subprocess`, fleet-box's below; the files are fleet-box's too.
- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 60000

# ── Nothing waits on a person: runs go unattended until someone steers ──

# Approval only ever widens a sandbox, and nothing here is confined, so every
# action already runs with full access. `never` answers any request at once
# with a rejection instead of waiting for a person; dsh pairs it with
# danger-full-access, but dsh-base keeps `ask` unless DSH_PERMISSION_MODE says so.
- id: approval
  config:
    policy: never

# ask_user's service; the tool cannot load without it.
- id: user-questions
  disabled: true

- id: ui-user-questions
  disabled: true

# ── One agent preset, no preset picker ──

- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: agent-preset-registry
  config:
    default: fleet

- insert:
    - id: preset-fleet
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fleet
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: Your working directory is {{cwd}}.

          # bash, foreground only: nothing it starts outlives its call, so an
          # idle agent has finished its work and its container can stop. A
          # command past its timeout (bash-local's default, raised per call up
          # to its cap) is killed rather than moved to the background, and
          # without background jobs the job_* tools have nothing to act on.
          # Background jobs are a todo in docs/todos.md.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: false
              promoteOnTimeout: false

          # read / write / edit
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # Not model tools: automatic compaction, /compact, and old tool-result pruning.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

# ═══ fleet-box: the Docker execution world ═══
#
# Every root session owns one container while it is unarchived: the session
# folder is bind-mounted at the same path, beside any mounts, variables and
# folders another plugin configured for the session (fleet-tau's agent
# snapshot and an agent's path arguments), which fleet-box keeps in
# $DSH_HOME/fleet/containers/<id>.json; everything else (/tmp included) is
# the container's own, and processes run as the container's root (you,
# under rootless Docker). Subagent sessions share their root's container; a
# fork gets its own. A container runs while dsh has its helper connected: it
# starts when something of its session needs it, keeps running while
# anything occupies it (a running turn, a sidebar terminal, a process, a file
# access), stops once nothing has for a minute (`idleStopMs` on the
# fleet-box row), at once when the `fleet` command finishes
# waiting and nothing occupies it, or when dsh exits or the helper is lost,
# and is removed when its session is archived; an unarchived session starts
# fresh, and the model is told once. The session image, with the helper
# built into it, is a prerequisite that dsh never builds: build it with
# `pnpm image` in the fleet checkout, which builds the workspace and runs
# `fleet setup image`, which tags it fleet-box:local, the image fleet-box
# uses unless `image` on the fleet-box row names another. fleet-box checks
# at startup that the image is there and that its helper speaks this
# fleet-box's protocol; otherwise it does not start, dsh's startup warning
# says so, and no session can run. A rebuild reaches the containers once dsh
# restarts, and recreates them.
#
# Status: ctx.fs and ctx.subprocess run each session's file tools and bash in
# its container, through fleet-box's helper. The helper also serves a
# service socket at $FLEET_SOCKET (/run/fleet/services.sock) and relays
# each call to whatever serves them on the host (fleet-tau's backends), for
# the session the container belongs to; without it, every call fails. The
# subprocess side serves bash, with collected output without spill files
# and no raw pipes or control channel, and the sidebar's terminals, as
# shells in the session's container.
# The file side serves a session's own work, which reads and writes, and
# any other call only when it names a session's container, which reads.
# That covers the file viewer: dsh looks up each session's folder through
# fleet-box as a path in its container, so the sidebar's file tree and
# previews, which the chat's file links open, read the container, never the
# host. These do not work: images of local paths in the chat or in a
# Markdown preview (`/api/file`), whose requests name no container, so they
# are refused, and live refresh of the file tree and previews, since the
# helper has no watches. Any other call outside a session's work names no
# container and fails instead of touching the host, so features that make
# such calls are disabled below until the world serves them.

# ── The world provides processes and files ──

- id: subprocess
  disabled: true

- insert:
    - id: fleet-box
      name: fleet-core/box/world

    - id: fleet-box-fs
      name: fleet-core/box/fs

    - id: fleet-box-subprocess
      name: fleet-core/box/subprocess

    # The container in the system prompt, and the notice when a session's
    # container is newer than its conversation.
    - id: fleet-box-context
      name: fleet-core/box/context

# ── Host details the model cannot use from its container ──

# The dsh checkout path and developer notes in the system prompt, and
# DSH_WEB_URL, a loopback URL of the host, in every command's environment.
# Patches replace a row's config whole, so this restates the other fields.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# ── Spill files: host files the model cannot open ──

# Oversized tool results would be saved to a host file the model is told to
# read, but its file tools read the container. Results stay inline instead;
# bash and read bound their own output. Bash output is not spilled either:
# ctx.subprocess keeps only its tail, and bash says the full output is
# unavailable.
- id: spill-policy
  disabled: true

# Referencing another session saves its full transcript the same way, to a
# host temp file the model is told to read; without a spill store the
# reference says the full transcript is unavailable.
- id: spill-local
  disabled: true

# ── Views that run processes, or read files, outside any session ──

# Office previews convert documents with LibreOffice through ctx.subprocess.
- id: office-to-pdf
  disabled: true

# `@` file mentions walk the host folder directly.
- id: file-reference-local
  disabled: true

# Changed-files card: git snapshots through host temp paths.
- id: workspace-changes
  disabled: true

- id: ui-deliverables
  disabled: true

# Open in app: finds apps through ctx.subprocess but launches them on the host.
- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

# Opening or revealing a path with the host's desktop apps: fleet-box maps no
# host path into a container, so these requests are refused anyway, and this
# tells the web client they are unavailable.
- id: session-controller
  config:
    nativeOpen: false

# ═══ fleet-tau: the tau runtime, which adds to fleet-box's containers and serves their service calls ═══
#
# `fleet run <agent-dir> [args...]` runs an agent directory in the tau format
# (@sleepymug/tau's SPEC.md): PROMPT.md filled with the arguments tau.json
# declares, the agent's skills, and the APIs its api/*.d.ts declare.
# fleet-tau reads the directory in a worker, checking its APIs, refuses one
# with problems before any session exists, and keeps a snapshot of it, whole
# and with its symlinks, per session in $DSH_HOME/fleet/sessions/<id>/,
# which fleet-box copies into each of the session's containers at /tau/agent;
# nothing of the store is mounted. The session's agents get the snapshot's
# skills, with dsh's `skill` tool, in a scope of their own; sessions started
# any other way keep the fleet preset unchanged.
#
# fleet links each API an agent declares to its own implementation of the
# same name (fleet-image's apis/), which the session image carries; there is no
# other. Some implementations run in the program alone; others call
# backends on the host, which fleet's plugins provide (`ctx.fleetBackends`),
# through $FLEET_SOCKET, fleet-box's service socket. An agent runs only when
# fleet implements each of its APIs, the implementation fits the API as tau
# checks, and the backends it calls are provided (`fleet check` tells ahead
# of time); its programs may then call those backends, and no others.
#
# Every session `fleet run` starts gets TypeScript tools: ts_modules and
# ts_execute, which run programs in the session's container with
# fleet-tau's runner. `fleet setup image` builds the runner into the
# session image (/opt/fleet/runner), and labels the image with the
# runner's protocol, which the tools check before they start it. Programs
# import the agent's APIs as @api/<name>, typed by the agent's declarations,
# which the runner links to fleet's implementations (/opt/fleet/apis).
#
# Path arguments reach the container according to their roles in tau.json,
# where fleet-tau places them, and the prompt names them there: an `in` path
# as a snapshot taken when the session is made, which fleet-box copies into
# the container at /tau/in/<name>/; an `out` path written in
# /tau/out/<name>/ and published to the caller after a completed turn a
# `fleet` command waited on; and a `share` path mounted at its real path,
# the same in the container as on the host, just as fleet-box mounts the
# workspace dir as the agent's cwd. Overlapping `out` paths are published
# outermost first, and one over an existing folder goes in entry by entry,
# so a folder that stays a folder keeps any mount of it. Paths may overlap
# each other and the workspace dir, but none may be, hold or lie in the dsh
# home, and a `share` path may not be, hold or lie in the container's system
# or fleet folders. The variables tau.json lists are
# passed from the caller's environment.

- insert:
    - id: fleet-tau-backends
      name: fleet-core/tau/backends

    - id: fleet-tau
      name: fleet-core/tau/store

    - id: fleet-tau-agent
      name: fleet-core/tau/agent

    - id: fleet-tau-relay
      name: fleet-core/tau/relay

    # An example backend: a per-session notebook, for examples/notes.
    - id: fleet-tau-notes
      name: fleet-core/tau/examples/notes
      disabled: true

    # An example backend: receipts of tarballs, for examples/archive-dir.
    - id: fleet-tau-archives
      name: fleet-core/tau/examples/archives
      disabled: true

# ═══ fleet-control: the control socket the `fleet` command talks to ═══
#
# It listens at $DSH_HOME/fleet/control.sock, which only the owner can open,
# and refuses to start while another dsh process serves that socket. A run
# has fleet-tau read and store its agent directory, then starts its session
# through dsh's session controller, so the web UI lists it.

- insert:
    - id: fleet-control
      name: fleet-core/control/server
