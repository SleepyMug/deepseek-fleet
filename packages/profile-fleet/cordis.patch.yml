# Fleet profile layer, applied after @deepseek-ai/dsh-base and @deepseek-ai/dsh-web-app.
# A patch's `name` only asserts an existing row's module, so swapping a module
# means disabling its row and inserting a replacement under a new id.

# ── No sandbox: unconfined bash and file tools, no Permissions selector ──

# The confining `ctx.shell` executor; it requires `ctx.sandbox`.
- id: bash-sandbox
  disabled: true

- id: sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

# Permission presets mount only over a confining bash executor.
- id: permission
  disabled: true

- id: ui-permission
  disabled: true

# Requires `ctx.sandbox`; no preset below uses PTC.
- id: ptc-runtime
  disabled: true

# The resolved mode is part of the model's runtime context every turn.
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- insert:
    - id: bash-local
      name: '@deepseek-ai/dsh-bash-local'
      config:
        timeoutMs: 60000

    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'

# ── Nothing waits on a person: runs go unattended until someone steers ──

# Approval only ever widens a sandbox, and nothing here is confined, so every
# action already runs with full access. `never` answers any request at once
# with a rejection instead of waiting for a person; dsh pairs it with
# danger-full-access, but dsh-base keeps `ask` unless DSH_PERMISSION_MODE says so.
- id: approval
  config:
    policy: never

# ask_user's service; the tool cannot load without it.
- id: user-questions
  disabled: true

- id: ui-user-questions
  disabled: true

# ── Models ──

# ChatGPT subscription through pi-ai's `openai-codex` provider. No `apiKeyEnv`:
# the route authenticates with the stored sign-in `llm-pi-ai/openai-codex`,
# which `fleet-setup signin` obtains once and llm-pi-ai refreshes afterwards.
#
# pi-ai's catalog sizes these models at 272,000 tokens. Overrides are checked
# leniently at startup: a misspelled model id leaves the real model unchanged
# without a warning, so confirm the new size in the model picker.
- id: llm-pi-ai
  config:
    providers:
      openai-codex:
        modelOverrides:
          gpt-6-astra:
            contextWindow: 1000000
          gpt-5.6-luna:
            contextWindow: 1000000
          gpt-5.6-sol:
            contextWindow: 1000000
          gpt-5.6-terra:
            contextWindow: 1000000

# ── One agent preset, no preset picker ──

- id: preset-standard
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-cordis
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: agent-preset-registry
  config:
    default: fleet

- insert:
    - id: preset-fleet
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: fleet
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
              suffix: Your working directory is {{cwd}}.

          # bash, foreground only: nothing it starts outlives its call, so an
          # idle agent has finished its work and its container can stop. A
          # command past its timeout (bash-local's default, raised per call up
          # to its cap) is killed rather than moved to the background, and
          # without background jobs the job_* tools have nothing to act on.
          # Background jobs are a todo in docs/todos.md.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            config:
              enableRunInBackground: false
              promoteOnTimeout: false

          # read / write / edit
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # Not model tools: automatic compaction, /compact, and old tool-result pruning.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
