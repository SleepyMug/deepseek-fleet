# The fleet's tau runtime, layered after fleet-box, whose containers it adds
# to and whose service calls it serves, and before fleet-control, whose
# `fleet run` stores each session's spec here: list it between them in the
# profile's bundles.
#
# `fleet run <agent-dir> [args...]` runs an agent directory in the tau format
# (@sleepymug/tau's SPEC.md): PROMPT.md filled with the arguments tau.json
# declares, the agent's skills, the services its services/*.d.ts declare,
# and the modules in its modules/. fleet-tau reads the directory in a
# worker, checking its modules and services, refuses one with problems
# before any session exists, and keeps a snapshot of it per session in
# $DSH_HOME/fleet/sessions/<id>/, which fleet-box copies into each of the
# session's containers at /opt/fleet/agent; nothing of the store is mounted.
# The session's agents get the snapshot's skills, with dsh's `skill` tool,
# in a scope of their own; sessions started any other way keep the fleet
# preset unchanged.
#
# Services are what fleet's own plugins provide (`ctx.fleetServices`), each
# a tau manifest and its functions. An agent runs only when every service it
# declares is provided and fits its declaration (`fleet check` tells ahead
# of time); programs in its container then call them through $TAU_SOCKET,
# fleet-box's service socket, and only the functions the agent declares.
#
# Every session `fleet run` starts gets TypeScript tools: ts_modules and
# ts_execute, which run programs in the session's container with
# fleet-tau's runner. `fleet-setup image` builds the runner into the
# session image (/opt/fleet/runner), and labels the image with the
# runner's protocol, which the tools check before they start it. Programs
# import the agent's services as @svc/<name>, and its modules by name.
#
# Path arguments reach the container where the caller has them, each
# according to its role in tau.json, as fleet-tau chooses: an `in` path as a
# snapshot taken when the session is made, which fleet-box copies into the
# container; an `inout` path mounted from the caller; and an `out` path
# published to the caller after a completed turn a `fleet` command waited
# on. The session folder counts as an implicit `inout` folder, so a path
# that is, holds or lies in it is refused. The variables tau.json lists are
# passed from the caller's environment.

- insert:
    - id: fleet-tau-services
      name: fleet-tau/services

    - id: fleet-tau
      name: fleet-tau/store

    - id: fleet-tau-agent
      name: fleet-tau/agent

    - id: fleet-tau-relay
      name: fleet-tau/relay

    # An example provider: a per-session notebook, for examples/notes.
    - id: fleet-tau-notes
      name: fleet-tau/examples/notes
      disabled: true
