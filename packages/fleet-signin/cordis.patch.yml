# The sign-in app, layered after dsh-base in a profile of its own: add it
# once with `dsh plugin --profile fleet-signin add <this folder>`, then sign
# in with `dsh fleet-signin [provider]`. The app runs one attempt and exits
# dsh, so a long-running profile must not select this bundle.
- insert:
    - id: fleet-signin
      name: '@sleepymug/fleet-signin/app'

- id: hmr
  disabled: true
