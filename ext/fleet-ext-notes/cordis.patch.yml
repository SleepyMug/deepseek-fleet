# fleet-ext-notes's bundle patch: list it after fleet-core in the fleet
# profile's bundles, and a tau that holds @sleepymug/tau-api-notes runs, its
# programs importing it as @api/<alias> (docs/fleet-ext-notes/index.md).
- insert:
    - id: fleet-ext-notes
      name: '@sleepymug/fleet-ext-notes/plugin'
      config:
        dshHome: !!js dshHomePath()
