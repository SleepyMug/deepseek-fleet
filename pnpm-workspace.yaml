packages:
  - packages/*
  # Extensions of the fleet host, built in and examples, each a dsh bundle of its own.
  - ext/*
  # tau is developed in a checkout of its own beside this one, and joins
  # this workspace from there. Install only here: `pnpm install` inside it
  # installs it on its own again, from its own lockfile, and the next install
  # here switches it back.
  - ../agent_fleet_project/tau
# A dependency on a member's version, such as fleet-core's on tau 0.1.0,
# links the member, so the members' manifests stay as they are.
linkWorkspacePackages: true
allowBuilds:
  # dsh's (the root's dev dependency, for `pnpm exec dsh`).
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true
# dsh is a release candidate, newer than the release age pnpm waits for.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
