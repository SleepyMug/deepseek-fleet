packages:
  - packages/*
  # tau and ts-executor are developed in checkouts of their own beside this
  # one, and join this workspace from there. Install only here: `pnpm install`
  # inside one of them installs it on its own again, from its own lockfile,
  # and the next install here switches it back.
  - ../agent_fleet_project/tau
  - ../agent_fleet_project/ts-executor
# A dependency on a member's version, such as fleet-core's on tau 0.1.0,
# links the member, so the members' manifests stay as they are.
linkWorkspacePackages: true
allowBuilds:
  # tsx's, which finds its platform binary in @esbuild/<platform> at runtime.
  esbuild: false
