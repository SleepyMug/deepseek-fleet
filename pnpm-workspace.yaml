packages:
  - packages/*
  # Services of the gateway, examples and built in, each its fleet server's
  # package.
  - services/*
  # tau, a repository of its own, a submodule here, at the commit this one
  # builds on. Install only here: `pnpm install` inside it installs it on
  # its own again, from its own lockfile, and the next install here
  # switches it back.
  - tau
# A dependency on a member's version, such as dsh-tau's on tau 0.1.0,
# links the member, so the members' manifests stay as they are.
linkWorkspacePackages: true
allowBuilds:
  # buf's binary is its platform package, which needs no script.
  '@bufbuild/buf': false
  # dsh's (the root's dev dependency, for `pnpm exec dsh`).
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  # dsh-tau's client bundle; its binary is its platform package, which needs no script.
  esbuild: false
  koffi: true
  node-pty: true
  protobufjs: true
# dsh is a release candidate, newer than the release age pnpm waits for.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
