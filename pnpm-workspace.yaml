packages:
  - packages/*
  # Extensions of the fleet host, built in and examples, each a dsh bundle of its own,
  # and the contract an extension provides, when it is not tau's, a package of its own.
  - ext/*
  - ext/*/contract
  # tau, a repository of its own, a submodule here, at the commit this one
  # builds on. Install only here: `pnpm install` inside it installs it on
  # its own again, from its own lockfile, and the next install here
  # switches it back.
  - tau
  # Its contracts, the tau API, which an extension implements.
  - tau/contracts/*
# A dependency on a member's version, such as fleet-core's on tau 0.1.0,
# links the member, so the members' manifests stay as they are.
linkWorkspacePackages: true
allowBuilds:
  # dsh's (the root's dev dependency, for `pnpm exec dsh`).
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  # fleet-core's client bundle; its binary is its platform package, which needs no script.
  esbuild: false
  koffi: true
  node-pty: true
  protobufjs: true
# dsh is a release candidate, newer than the release age pnpm waits for.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
