# Docker execution world, layered after profile-fleet: it replaces that
# bundle's `fs-local` row and dsh-base's `subprocess` row, and turns off what
# the world cannot serve, so list it later in the profile's bundles.
#
# Every root session owns one container while it is unarchived: the session
# folder is bind-mounted at the same path, everything else (/tmp included)
# is the container's own, and processes run as the container's root (you,
# under rootless Docker). Subagent sessions share their root's container; a
# fork gets its own. A container runs while dsh has its helper connected: it
# starts when something of its session needs it, keeps running while
# anything occupies it (a running turn, a sidebar terminal, a process), stops
# once nothing has for a minute (`idleStopMs` on the fleet-box row), at once
# when fleet-control's `fleet` command finishes waiting and nothing occupies
# it, or when dsh exits or the helper is lost, and is removed when its session
# is archived; an unarchived session starts fresh, and the model is told
# once. The session image, with the helper built into it, is a prerequisite:
# build it with `fleet-setup image` from the fleet-setup package, installed in
# the same profile (`dsh plugin --profile fleet exec fleet-setup image`).
# Without it fleet-box does not start, dsh's startup warning says so, and no
# session can run.
#
# Status: ctx.fs and ctx.subprocess run each session's file tools and bash in
# its container, through fleet-box's helper. The subprocess side serves bash,
# with collected output without spill files and no raw pipes or control
# channel, and the sidebar's terminals, as shells in the session's container.
# A file call outside any session's turn, like the sidebar's file tree and
# previews or the chat's file links (`/api/file`), reads the host, but only
# the registered workspace folders, which the containers mount at the same
# paths; what exists only in a container is not shown. Any other call outside
# a session's work fails instead of touching the host, so features that make
# such calls are disabled below until the world serves them.

# ── The world replaces the local execution providers ──

- id: subprocess
  disabled: true

- id: fs-local
  disabled: true

- insert:
    - id: fleet-box
      name: fleet-box/world

    - id: fleet-box-fs
      name: fleet-box/fs

    - id: fleet-box-subprocess
      name: fleet-box/subprocess

    # The container in the system prompt, and the notice when a session's
    # container is newer than its conversation.
    - id: fleet-box-context
      name: fleet-box/context

# ── Host details the model cannot use from its container ──

# The dsh checkout path and developer notes in the system prompt, and
# DSH_WEB_URL, a loopback URL of the host, in every command's environment.
# Patches replace a row's config whole, so this restates the other fields.
- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# ── Spill files: host files the model cannot open ──

# Oversized tool results would be saved to a host file the model is told to
# read, but its file tools read the container. Results stay inline instead;
# bash and read bound their own output. Bash output is not spilled either:
# ctx.subprocess keeps only its tail, and bash says the full output is
# unavailable.
- id: spill-policy
  disabled: true

# ── Views that run processes, or read files, outside any session ──

# Office previews convert documents with LibreOffice through ctx.subprocess.
- id: office-to-pdf
  disabled: true

# `@` file mentions walk the host folder directly.
- id: file-reference-local
  disabled: true

# Changed-files card: git snapshots through host temp paths.
- id: workspace-changes
  disabled: true

- id: ui-deliverables
  disabled: true

# Open in app: finds apps through ctx.subprocess but launches them on the host.
- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true
